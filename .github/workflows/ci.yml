name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: extractions/setup-just@v3
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.6
      - run: just setup
      - run: just check
